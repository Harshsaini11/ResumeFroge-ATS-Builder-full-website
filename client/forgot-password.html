<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ResumeForge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/auth.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <span class="brand-icon">⚡</span>
                <div class="brand-text">
                    <h1>ResumeForge</h1>
                    <p>Dynamic & ATS-Friendly Resume Builder</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="login.html" class="btn-theme-toggle" style="text-decoration: none;">🔑 Log In</a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card-box">
            <div class="auth-header-title">
                <h2>Reset Password 🔑</h2>
                <p>Verify email via OTP to set a new password</p>
            </div>

            <!-- STEP 1: ENTER EMAIL TO SEND OTP -->
            <form id="forgot-step1">
                <div class="auth-group">
                    <label>Registered Email Address</label>
                    <input type="email" id="forgot-email" class="auth-input" placeholder="abc@gmail.com" required>
                </div>
                <button type="submit" id="send-forgot-otp-btn" class="auth-btn">Send Reset OTP 📩</button>
            </form>

            <!-- STEP 2: VERIFY OTP & SET NEW PASSWORD -->
            <form id="forgot-step2" style="display: none; margin-top: 15px;">
                <p style="text-align: center; font-size: 13px; color: #475569; margin-bottom: 12px;">
                    Enter 6-digit OTP sent to <strong id="display-forgot-email"></strong>
                </p>

                <div class="auth-group">
                    <label>Enter 6-digit OTP</label>
                    <input type="text" id="forgot-otp" class="auth-input" placeholder="123456" maxlength="6" style="text-align: center; letter-spacing: 4px; font-weight: bold; font-size: 18px;" required>
                </div>

                <div class="auth-group">
                    <label>New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="new-password" class="auth-input" placeholder="At least 6 characters" minlength="6" required>
                        <span class="toggle-password-eye" onclick="togglePasswordVisibility('new-password', this)">👁️</span>
                    </div>
                </div>

                <button type="submit" class="auth-btn">Update Password 🔒</button>

                <!-- 🔄 RESEND OTP SECTION -->
                <div style="text-align: center; margin-top: 15px; font-size: 13px; color: #64748b;">
                    Didn't receive the OTP? 
                    <button type="button" id="resend-otp-btn" onclick="triggerResendOtp()" style="background: none; border: none; color: #2563eb; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; margin-left: 4px;" disabled>
                        Resend OTP (30s)
                    </button>
                </div>
            </form>

            <div class="auth-footer-text">
                Remembered your password? <a href="login.html" class="auth-link-bold">Log In</a>
            </div>
        </div>
    </div>

    <script>
        let resetEmail = "";
        let timerInterval = null;

        // Step 1: Request Reset OTP
        document.getElementById('forgot-step1').addEventListener('submit', async (e) => {
            e.preventDefault();
            resetEmail = document.getElementById('forgot-email').value;

            const btn = document.getElementById('send-forgot-otp-btn');
            btn.innerText = "Sending OTP...";
            btn.disabled = true;

            const success = await sendOtpToEmail(resetEmail, 'forgot');
            btn.innerText = "Send Reset OTP 📩";
            btn.disabled = false;

            if (success) {
                document.getElementById('forgot-step1').style.display = 'none';
                document.getElementById('forgot-step2').style.display = 'block';
                document.getElementById('display-forgot-email').innerText = resetEmail;
                startResendTimer(30); // Start 30sec timer
            }
        });

        // Step 2: Verify OTP & Change Password
        document.getElementById('forgot-step2').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('forgot-otp').value;
            const newPassword = document.getElementById('new-password').value;
            await handleResetPasswordWithOtp(resetEmail, otp, newPassword);
        });

        // ⏱️ Resend Countdown Timer Logic
        function startResendTimer(seconds) {
            const resendBtn = document.getElementById('resend-otp-btn');
            resendBtn.disabled = true;
            let timeLeft = seconds;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.innerText = "Resend OTP 🔄";
                    resendBtn.disabled = false;
                } else {
                    resendBtn.innerText = `Resend OTP (${timeLeft}s)`;
                    timeLeft--;
                }
            }, 1000);
        }

        // 🔄 Resend OTP Trigger Action
        async function triggerResendOtp() {
            const resendBtn = document.getElementById('resend-otp-btn');
            resendBtn.innerText = "Sending...";
            resendBtn.disabled = true;

            const success = await sendOtpToEmail(resetEmail, 'forgot');
            if (success) {
                startResendTimer(30); // Reset timer to 30s
            } else {
                resendBtn.innerText = "Resend OTP 🔄";
                resendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
